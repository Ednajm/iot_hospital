<!doctype html>
<html lang="it">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Analytics - IOT Hospital Dashboard</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        {% include 'navbar.html' %}
        <div class="container-fluid">
            <div class="row">
                {% include 'sidebar.html' %}
                <main class="col">
                    <div class="main-container">
                        <div class="page-header scale-in">
                            <h1><i class="bi bi-bar-chart-line-fill me-3"></i>Analytics & Reportistica</h1>
                            <p class="mb-0">Visualizza statistiche e trend del sistema ospedaliero</p>
                        </div>
                        <div class="row">
                            <div class="col-12">
                                <div class="chart-card fade-in">
                                    <h5><i class="bi bi-graph-up"></i> Dashboard Analytics</h5>
                                    <p class="text-muted">Statistiche dettagliate e report avanzati disponibili a breve...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <button id="refresh-btn" class="refresh-btn"><i class="bi bi-arrow-clockwise"></i></button>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>

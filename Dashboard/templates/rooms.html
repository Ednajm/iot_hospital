<!doctype html>
<html lang="it">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Stanze - IOT Hospital Dashboard</title>
        
        <link rel="preconnect" href="https://cdn.jsdelivr.net">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>

    <body>
        {% include 'navbar.html' %}

        <div class="container-fluid">
            <div class="row">
                {% include 'sidebar.html' %}

                <main class="col">
                    <div class="main-container">
                        <div class="page-header scale-in">
                            <h1><i class="bi bi-building-fill me-3"></i>Gestione Stanze</h1>
                            <p class="mb-0">Monitora le condizioni ambientali di tutte le stanze</p>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-3 mb-3">
                                <div class="stat-card room-card fade-in">
                                    <div class="card-icon">
                                        <i class="bi bi-building"></i>
                                    </div>
                                    <h3>500</h3>
                                    <p>Stanze Totali</p>
                                </div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <div class="stat-card patient-card fade-in">
                                    <div class="card-icon">
                                        <i class="bi bi-door-open-fill"></i>
                                    </div>
                                    <h3>423</h3>
                                    <p>Occupate</p>
                                </div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <div class="stat-card asset-card fade-in">
                                    <div class="card-icon">
                                        <i class="bi bi-door-closed-fill"></i>
                                    </div>
                                    <h3>77</h3>
                                    <p>Disponibili</p>
                                </div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <div class="stat-card alert-card fade-in">
                                    <div class="card-icon">
                                        <i class="bi bi-exclamation-triangle-fill"></i>
                                    </div>
                                    <h3>5</h3>
                                    <p>Allerta Ambiente</p>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-12">
                                <div class="chart-card fade-in">
                                    <h5>
                                        <i class="bi bi-thermometer-half"></i>
                                        Condizioni Ambientali
                                    </h5>
                                    <div class="chart-container">
                                        <canvas id="roomChart"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <button id="refresh-btn" class="refresh-btn">
            <i class="bi bi-arrow-clockwise"></i>
        </button>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
